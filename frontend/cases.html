<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>可疑案例看板</title>
    <style>
        /* =========================================
           1. CSS 样式区：负责页面的“长相”
           ========================================= */

        /* 页面整体基础设置 */
        body {
            font-family: Arial, sans-serif; /* 字体 */
            background-color: #f5f5f5;      /* 背景色：浅灰 */
            margin: 0;                      /* 去掉浏览器默认边距 */
            padding: 20px;                  /* 页面内容离边缘留出 20px */
        }

        /* 顶部深蓝色标题栏 */
        .header {
            background-color: #1a5276;
            color: white;
            padding: 15px 20px;
            border-radius: 8px;             /* 圆角 */
            margin-bottom: 20px;            /* 下方留白，和下面卡片隔开 */
        }
        .header h1 { margin: 0; font-size: 22px; }
        .header p  { margin: 5px 0 0; font-size: 13px; opacity: 0.8; }

        /* 统计卡片区：用 Flex 布局让三个卡片横排 */
        .cards {
            display: flex;                  /* 开启 Flex 横排魔法 */
            gap: 20px;                      /* 卡片之间的间距 */
            margin-bottom: 20px;            /* 下方留白，和筛选栏隔开 */
        }
        .card {
            flex: 1;                        /* 每个卡片平分剩余宽度（1:1:1） */
            background-color: white;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #ddd;
            text-align: center;             /* 卡片内文字居中 */
        }
        .card .number {                     /* 卡片里的大数字 */
            font-size: 28px;
            font-weight: bold;
            color: #e74c3c;                 /* 红色醒目 */
        }
        .card .label {                      /* 卡片里的文字标签 */
            color: #666;
            font-size: 14px;
            margin-top: 5px;
        }

        /* 筛选表单区 */
        .filter-bar {
            background-color: white;
            padding: 15px 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: flex;                  /* 让下拉框、标签、按钮横排 */
            gap: 15px;
            align-items: center;            /* 垂直居中对齐 */
        }
        .filter-bar select {
            padding: 6px 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        .filter-bar button {
            padding: 8px 20px;
            background-color: #4a90d9;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;                /* 鼠标放上去变成小手 */
        }

        /* 数据表格样式 */
        table {
            width: 100%;                    /* 表格占满父容器 */
            border-collapse: collapse;      /* 去掉单元格之间的双线 */
            background-color: white;
            border-radius: 8px;
            overflow: hidden;               /* 配合圆角，让表格边角变圆 */
        }
        th {
            background-color: #34495e;
            color: white;
            padding: 12px;
            text-align: left;               /* 表头文字左对齐 */
        }
        td {
            padding: 12px;
            border-bottom: 1px solid #eee;  /* 每行底部的浅灰分隔线 */
        }
        tr:hover { background-color: #f9f9f9; } /* 鼠标悬停行变灰 */
    </style>
</head>
<body>

<!-- =========================================
     2. HTML 骨架区：负责页面的“结构”
     ========================================= -->

<!-- 顶部标题栏 -->
<div class="header">
    <h1>mini-aml 可疑案例看板</h1>
    <p>反洗钱交易监测系统 v0.4</p>
</div>

<!-- 统计卡片区 -->
<div class="cards">
    <!-- 注意：这里的 id="totalCount" 是给下面 JS 用的，JS 靠它找到数字并修改 -->
    <div class="card">
        <div class="number" id="totalCount">0</div>
        <div class="label">案例总数</div>
    </div>
    <div class="card">
        <div class="number" id="pendingCount">0</div>
        <div class="label">待处理案例</div>
    </div>
    <div class="card">
        <div class="number" id="verifiedCount">0</div>
        <div class="label">已核实案例</div>
    </div>
</div>

<!-- 筛选表单区 -->
<div class="filter-bar">
    <label for="ruleFilter">规则类型：</label>
    <!-- id="ruleFilter" 很重要，JS 会通过它拿到你选中的值 -->
    <select id="ruleFilter">
        <option value="">全部</option>
        <option value="单笔大额交易">单笔大额交易</option>
        <option value="单日累计交易">单日累计交易</option>
        <option value="拆分交易识别">拆分交易识别</option>
    </select>

    <label for="statusFilter">状态：</label>
    <select id="statusFilter">
        <option value="">全部</option>
        <option value="待处理">待处理</option>
        <option value="已核实">已核实</option>
        <option value="已上报">已上报</option>
    </select>

    <button id="searchBtn">搜索</button>
</div>

<!-- 数据表格区 -->
<table>
    <thead>
    <tr>
        <th>案例编号</th>
        <th>账户ID</th>
        <th>规则名</th>
        <th>状态</th>
        <th>创建时间</th>
    </tr>
    </thead>
    <!-- 核心！这个 tbody 里面现在是空的，等下 JS 会把数据变成 <tr> 塞进来 -->
    <tbody id="caseBody"></tbody>
</table>

<script>
    // =========================================
    // 3. JavaScript 逻辑区：负责页面的“动作”
    // =========================================

    // 【全局变量】把从 JSON 拿到的所有数据存在这里，方便后续筛选
    let allCases = [];

    // 【第一步：加载数据】当页面刚打开（window.onload）时，自动去拿数据
    window.onload = function() {
        // fetch 就是向服务器（这里是本地文件 cases.json）要数据
        fetch("cases.json")
            .then(res => res.json()) // 把拿到的内容解析成 JSON 格式（数组）
            .then(data => {
                allCases = data;            // 1. 把数据存进全局变量
                renderTable(allCases);      // 2. 把数据画到表格上
                updateStats(allCases);      // 3. 把数据统计画到卡片上
            })
            .catch(err => {
                console.error("加载失败：", err);
                alert("加载失败，请按 F12 看控制台");
            });
    };

    // 【第二步：渲染表格】把数据变成 HTML 标签，塞进页面的表格里
    function renderTable(data) {
        let tbody = document.querySelector("#caseBody"); // 找到那个空 tbody
        tbody.innerHTML = ""; // 先把旧数据清空，防止重复累加

        // 如果筛选后没有数据，显示一句提示
        if (data.length === 0) {
            tbody.innerHTML = `<tr><td colspan="5" style="text-align:center;color:#999;">没有匹配的数据</td></tr>`;
            return;
        }

        // 遍历传进来的数据数组，一条数据生成一行 <tr>
        data.forEach(c => {
            // 这里的 ${c.caseNo} 是模板字符串，把数据拼接到 HTML 里
            let row = `
                <tr>
                    <td>${c.caseNo}</td>
                    <td>${c.accountId}</td>
                    <td>${c.ruleName}</td>
                    <td>${c.status}</td>
                    <td>${c.createTime}</td>
                </tr>
            `;
            tbody.innerHTML += row; // 把这一行塞进表格里
        });
    }

    // 【第三步：更新统计】计算卡片上的数字
    function updateStats(data) {
        // data.length 就是总条数
        document.querySelector("#totalCount").innerText = data.length;
        // filter 过滤出状态为“待处理”的条数，然后用 .length 求数量
        document.querySelector("#pendingCount").innerText = data.filter(c => c.status === "待处理").length;
        document.querySelector("#verifiedCount").innerText = data.filter(c => c.status === "已核实").length;
    }

    // 【第四步：绑定事件】点击按钮后，执行筛选
    document.querySelector("#searchBtn").addEventListener("click", function() {
        // 拿到下拉框选中的值（如：单笔大额交易、待处理）
        let rule = document.querySelector("#ruleFilter").value;
        let status = document.querySelector("#statusFilter").value;

        // 用 filter 对 allCases 进行过滤
        let filtered = allCases.filter(c => {
            // 判断规则：如果没选（rule === ""），或者选了且匹配上了
            let matchRule = (rule === "" || c.ruleName === rule);
            let matchStatus = (status === "" || c.status === status);
            // 两个条件都满足，才保留这条数据
            return matchRule && matchStatus;
        });

        // 把过滤后的数据重新渲染到表格，更新卡片
        renderTable(filtered);
        updateStats(filtered);
    });
</script>
</body>
</html>
