<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>可疑案例看板</title>
    <style>
        /* ===== 基础样式 ===== */
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            margin: 0;
            padding: 20px;
        }

        /* ===== 顶部标题栏 ===== */
        .header {
            background-color: #1a5276;
            color: white;
            padding: 15px 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        .header h1 { margin: 0; font-size: 22px; }
        .header p  { margin: 5px 0 0; font-size: 13px; opacity: 0.8; }

        /* ===== 统计卡片区 ===== */
        .cards {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }
        .card {
            flex: 1;
            background-color: white;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #ddd;
            text-align: center;
        }
        .card .number {
            font-size: 28px;
            font-weight: bold;
            color: #e74c3c;
        }
        .card .label {
            color: #666;
            font-size: 14px;
            margin-top: 5px;
        }

        /* ===== 筛选表单区 ===== */
        .filter-bar {
            background-color: white;
            padding: 15px 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: flex;
            gap: 15px;
            align-items: center;
        }
        .filter-bar label { font-size: 14px; color: #333; }
        .filter-bar select {
            padding: 6px 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 14px;
        }
        .filter-bar button {
            padding: 8px 20px;
            background-color: #4a90d9;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
        }
        .filter-bar button:hover { background-color: #357abd; }

        /* ===== 表格样式 ===== */
        table {
            width: 100%;
            border-collapse: collapse;
            background-color: white;
            border-radius: 8px;
            overflow: hidden;
        }
        th {
            background-color: #34495e;
            color: white;
            padding: 12px;
            text-align: left;
            font-size: 14px;
        }
        td {
            padding: 12px;
            border-bottom: 1px solid #eee;
            font-size: 14px;
        }
        tr:hover { background-color: #f9f9f9; }
    </style>
</head>
<body>

<!-- 顶部标题栏 -->
<div class="header">
    <h1>mini-aml 可疑案例看板</h1>
    <p>反洗钱交易监测系统 v0.4</p>
</div>

<!-- 统计卡片区 -->
<div class="cards">
    <div class="card">
        <div class="number" id="totalCount">0</div>
        <div class="label">案例总数</div>
    </div>
    <div class="card">
        <div class="number" id="pendingCount">0</div>
        <div class="label">待处理案例</div>
    </div>
    <div class="card">
        <div class="number" id="verifiedCount">0</div>
        <div class="label">已核实案例</div>
    </div>
</div>

<!-- 筛选表单区 -->
<div class="filter-bar">
    <label for="ruleFilter">规则类型：</label>
    <select id="ruleFilter">
        <option value="">全部</option>
        <option value="单笔大额交易">单笔大额交易</option>
        <option value="单日累计交易">单日累计交易</option>
        <option value="拆分交易识别">拆分交易识别</option>
    </select>

    <label for="statusFilter">状态：</label>
    <select id="statusFilter">
        <option value="">全部</option>
        <option value="待处理">待处理</option>
        <option value="已核实">已核实</option>
        <option value="已上报">已上报</option>
    </select>

    <button id="searchBtn">搜索</button>
</div>

<!-- 数据表格区 -->
<table>
    <thead>
    <tr>
        <th>案例编号</th>
        <th>账户ID</th>
        <th>规则名</th>
        <th>状态</th>
        <th>创建时间</th>
    </tr>
    </thead>
    <tbody id="caseBody">
    <!-- 数据会被 JS 动态插入 -->
    </tbody>
</table>

<script>
    // ===== 全局变量：存所有案例数据 =====
    let allCases = [];

    // ===== 页面加载完成后，自动请求数据 =====
    window.onload = function() {
        fetch("cases.json")
            .then(res => res.json())
            .then(data => {
                allCases = data;
                renderTable(allCases);
                updateStats(allCases);
            })
            .catch(err => {
                console.error("加载失败：", err);
                alert("加载失败，请按 F12 看控制台");
            });
    };

    // ===== 渲染表格 =====
    function renderTable(data) {
        let tbody = document.getElementById("caseBody");
        tbody.innerHTML = "";

        if (data.length === 0) {
            tbody.innerHTML = `<tr><td colspan="5" style="text-align:center;color:#999;">没有匹配的数据</td></tr>`;
            return;
        }

        data.forEach(c => {
            let row = `
                <tr>
                    <td>${c.caseNo}</td>
                    <td>${c.accountId}</td>
                    <td>${c.ruleName}</td>
                    <td>${c.status}</td>
                    <td>${c.createTime}</td>
                </tr>
            `;
            tbody.innerHTML += row;
        });
    }

    // ===== 更新统计卡片 =====
    function updateStats(data) {
        document.getElementById("totalCount").innerText = data.length;
        document.getElementById("pendingCount").innerText = data.filter(c => c.status === "待处理").length;
        document.getElementById("verifiedCount").innerText = data.filter(c => c.status === "已核实").length;
    }

    // ===== 筛选功能：点击搜索按钮 =====
    document.getElementById("searchBtn").addEventListener("click", function() {
        let rule = document.getElementById("ruleFilter").value;
        let status = document.getElementById("statusFilter").value;

        let filtered = allCases.filter(c => {
            let matchRule = (rule === "" || c.ruleName === rule);
            let matchStatus = (status === "" || c.status === status);
            return matchRule && matchStatus;
        });

        renderTable(filtered);
        updateStats(filtered);
    });
</script>
</body>
</html>
