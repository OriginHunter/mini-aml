<!DOCTYPE html>
<!-- DOCTYPE 告诉浏览器：这是一个 HTML5 页面。必须写在第一行。 -->

<html lang="zh-CN">
<!-- <html> 是整个页面的根标签，所有内容都包在里面。lang="zh-CN" 表示页面语言是中文。 -->

<head>
    <!-- <head> 里放的是"给浏览器看"的信息，用户看不到。 -->

    <meta charset="UTF-8">
    <!-- charset="UTF-8" 表示页面用 UTF-8 编码，这样中文才不会乱码。 -->

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- 让页面在手机上也能正常显示（响应式）。现在先加上，不用深究。 -->

    <title>mini-aml 可疑案例看板</title>
    <!-- <title> 是浏览器标签页上显示的文字。 -->

    <style>
        /* <style> 里面写 CSS，负责"怎么显示"。 */

        /* body 是整个页面的"身体"，里面的所有可见内容都在这。 */
        body {
            font-family: Arial, sans-serif;   /* 字体 */
            background-color: #f5f5f5;        /* 背景色：浅灰色 */
            margin: 0;                        /* 去掉浏览器默认的外边距 */
            padding: 20px;                    /* 页面内容离边缘 20px */
        }

        /* .header 是"类选择器"，选中所有 class="header" 的元素。 */
        .header {
            background-color: #1a5276;        /* 深蓝灰色背景 */
            color: white;                     /* 文字白色 */
            padding: 15px 20px;               /* 内边距：上下15px，左右20px */
            border-radius: 8px;               /* 圆角 */
            margin-bottom: 20px;              /* 下面留 20px 空白 */
        }

        /* 统计卡片区：用 Flex 让三个卡片横着排。 */
        .cards {
            display: flex;                    /* 开启 Flex 布局，子元素横着排 */
            gap: 20px;                        /* 卡片之间的间距 */
            margin-bottom: 20px;              /* 下面留空白 */
        }

        /* 单个卡片 */
        .card {
            flex: 1;                          /* 每个卡片平分宽度 */
            background-color: white;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #ddd;           /* 浅灰色边框 */
            text-align: center;               /* 文字居中 */
        }

        /* 卡片里的数字 */
        .card .number {
            font-size: 28px;                  /* 字号大一点 */
            font-weight: bold;                /* 加粗 */
            color: #e74c3c;                   /* 红色，表示"重要" */
        }

        /* 卡片里的文字标签 */
        .card .label {
            color: #666;                      /* 灰色 */
            font-size: 14px;
        }

        /* 表格样式 */
        table {
            width: 100%;                      /* 表格占满整个宽度 */
            border-collapse: collapse;        /* 合并边框，看起来更干净 */
            background-color: white;
            border-radius: 8px;               /* 圆角 */
            overflow: hidden;                 /* 让圆角生效（配合 border-radius） */
        }

        /* 表头单元格 */
        th {
            background-color: #34495e;        /* 深色背景 */
            color: white;
            padding: 12px;
            text-align: left;                 /* 文字左对齐 */
        }

        /* 数据单元格 */
        td {
            padding: 12px;
            border-bottom: 1px solid #eee;    /* 每行下面加一条浅灰色分隔线 */
        }

        /* 鼠标悬停在表格行上时变色 */
        tr:hover {
            background-color: #f9f9f9;
        }
    </style>
</head>

<body>
<!-- 下面开始是用户能看到的内容。 -->

<!-- 顶部标题栏 -->
<div class="header">
    <h1>OriginHunter 的可疑案例看板</h1>
    <!-- <h1> 是一级标题，字最大。 -->
    <p>反洗钱交易监测系统 v0.4</p>
    <!-- <p> 是段落。 -->
</div>

<!-- 统计卡片区：三个卡片横着排 -->
<div class="cards">

    <div class="card">
        <div class="number">25</div>
        <div class="label">今日命中案例</div>
    </div>

    <div class="card">
        <div class="number">12</div>
        <div class="label">待处理案例</div>
    </div>

    <div class="card">
        <div class="number">5</div>
        <div class="label">高风险账户</div>
    </div>

</div>

<!-- 筛选表单区 -->
<div style="margin-bottom: 20px;">
    <!-- style="..." 叫"行内样式"，直接写在标签上，只对这一个标签生效。 -->

    <label for="ruleType">规则类型：</label>
    <!-- <label> 是输入框的说明文字。for="ruleType" 和下面 select 的 id 对应，点击文字能聚焦到下拉框。 -->

    <select id="ruleType">
        <!-- <select> 是下拉框。 -->
        <option value="">全部</option>
        <!-- <option> 是下拉选项。value 是提交给后端的值，标签中间是显示给用户的文字。 -->
        <option value="LARGE_AMOUNT">单笔大额</option>
        <option value="DAILY_AMOUNT">单日累计</option>
        <option value="SMURFING">拆分交易</option>
    </select>

    <button>搜索</button>
    <!-- <button> 是按钮。现在点了没反应，后面学了 JS 再加功能。 -->
</div>

<!-- 案例表格区 -->
<table>
    <tr>
        <!-- <tr> 是表格的一行。 -->
        <th>案例编号</th>
        <!-- <th> 是表头单元格（默认加粗居中）。 -->
        <th>账户ID</th>
        <th>规则名</th>
        <th>状态</th>
        <th>创建时间</th>
    </tr>

    <tr>
        <td>CASE-0001</td>
        <!-- <td> 是数据单元格。 -->
        <td>1</td>
        <td>单笔大额交易</td>
        <td>待处理</td>
        <td>2026-10-14 10:30</td>
    </tr>

    <tr>
        <td>CASE-0002</td>
        <td>2</td>
        <td>拆分交易识别</td>
        <td>已核实</td>
        <td>2026-10-14 11:15</td>
    </tr>

    <tr>
        <td>CASE-0003</td>
        <td>3</td>
        <td>单日累计交易</td>
        <td>待处理</td>
        <td>2026-10-14 14:20</td>
    </tr>

    <tr>
        <td>CASE-0004</td>
        <td>2</td>
        <td>单笔大额交易</td>
        <td>待处理</td>
        <td>2026-10-14 15:20</td>
    </tr>
</table>

</body>
</html>
