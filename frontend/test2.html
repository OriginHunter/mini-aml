<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>练习1 - 表格骨架</title>
  <!-- TODO 1: 在这里加 <style> 标签，CSS 先不写，练习2再加 -->
  <style>




    /* TODO 1: 给 body 加字体和浅灰色背景色 */
    body{
          /* body */
      font-family: Arial, sans-serif;    /* 字体 */
      background-color: #f5f5f5;         /* 背景色 */
      padding: 20px;                     /* 内边距 */
    }

    /* TODO 2: 给 table 加：
       - 宽度 100%（width）
       - 合并边框（border-collapse: collapse）
       - 白色背景（background-color） */
       table{
          /* table */
          width: 100%;                       /* 宽度占满 */
          border-collapse: collapse;         /* 合并边框 */
          background-color: white;           /* 背景色 */
       }

    /* TODO 3: 给 th 加：
       - 背景色 #4a90d9（蓝色）
       - 文字白色
       - 内边距 12px
       - 文字左对齐 */
       th{
          /* th（表头） */
          background-color: #4a90d9;         /* 背景色：蓝色 */
          color: white;                      /* 文字颜色：白 */
          padding: 12px;                     /* 内边距 */
          text-align: left;                  /* 文字左对齐 */
       }

    /* TODO 4: 给 td 加：
       - 内边距 12px
       - 底部边框 1px solid #eee */
       td{
          /* td（单元格） */
          padding: 12px;                     /* 内边距 */
          border-bottom: 1px solid #eee;     /* 底部边框 */
       }

    /* TODO 5: 给 tr:hover 加背景色 #f9f9f9 */
    tr:hover{
      /* tr:hover（鼠标悬停） */
      background-color: #f9f9f9;         /* 背景色：浅灰 */
    }
  </style></head>
<body>

<!-- TODO 2: 写一个 <h2> 标题，内容为"测试表格" -->
<h2>测试表格</h2>
<!-- TODO 3: 写一个 <table>，表头有 2 列：姓名、年龄 -->
<table>
  <thead>
  <tr>
    <th>姓名</th>
    <th>年龄</th>
  </tr>
  </thead>
  <!-- TODO 4: 在表格里加 3 行数据 -->
  <tbody>
  <!--         第一行：张三、25 -->
  <tr>
    <td>张三</td>
    <td>25</td>
  </tr>
  <!--         第二行：李四、30 -->
  <tr>
    <td>李四</td>
    <td>30</td>
  </tr>
  <!--         第三行：王五、28 -->
  <tr>
    <td>王五</td>
    <td>28</td>
  </tr>

  </tbody>
</table>

</body>
</html>
